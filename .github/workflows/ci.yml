name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 pytest-cov coverage-badge

      - name: Lint (flake8, errors only)
        run: flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Run full pipeline (smoke test)
        run: |
          cd src
          python main.py --n-sims 200

      - name: Generate coverage badge
        if: matrix.python-version == '3.11' && github.event_name == 'push'
        run: coverage-badge -f -o coverage.svg

      - name: Commit updated coverage badge
        if: matrix.python-version == '3.11' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet coverage.svg || (git add coverage.svg && git commit -m "Update coverage badge [skip ci]" && git push)
